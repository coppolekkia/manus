name: Costruisci e Pubblica su GHCR

on:
  push:
  workflow_dispatch:

jobs:
  build-and-push:
# ... (lascia tutto il resto identico da runs-on in poi)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4

      - name: Login al Registro Pacchetti di GitHub
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Costruisci e Pubblica
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/coppolekkia/manus:latest
